name: Bug report
description: Report a problem with the TiboTattle macOS app.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security problems, use a private GitHub
        Security Advisory, not a public issue (see SECURITY.md). Problems with
        omp itself belong in omp's repository; TiboTattle is not affiliated with omp.
  - type: input
    id: version
    attributes:
      label: TiboTattle app version or commit (Finder › Get Info shows the version)
      placeholder: 0.3.0 or a commit hash
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where does it happen?
      options:
        - Menu bar item
        - Popover
        - Dashboard window
        - Start at login
        - Launching or installing the app
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.0
    validations:
      required: true
  - type: dropdown
    id: arch
    attributes:
      label: Mac architecture
      options:
        - Apple silicon (arm64)
        - Intel (x86_64)
    validations:
      required: true
  - type: input
    id: omp
    attributes:
      label: omp version
      placeholder: omp x.y.z
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps. Use synthetic examples only.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include any fixed error code the popover shows (for example `store_newer`). Check screenshots for private data before sharing. Never paste session content.
    validations:
      required: true
  - type: checkboxes
    id: no-session-content
    attributes:
      label: Content check
      options:
        - label: This report contains no prompts, model responses, real file paths or account details from coding-agent sessions.
          required: true
