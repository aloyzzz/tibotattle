name: Bug report
description: Report a problem with the TiboTattle CLI, dashboard or desktop app.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For security problems, use a private GitHub
        Security Advisory, not a public issue (see SECURITY.md). Problems with
        omp itself belong in omp's repository; TiboTattle is not affiliated with omp.
  - type: input
    id: version
    attributes:
      label: TiboTattle version or commit
      placeholder: 0.2.0 or a commit hash
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where does it happen?
      options:
        - CLI (serve, scan, report, doctor)
        - Browser dashboard
        - Desktop app (Electron)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system, Node.js version and omp version
      placeholder: macOS 26.0 arm64, Node.js 22.13.1, omp x.y.z
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `node bin/tibotattle.js doctor`
      description: Run it without `--show-paths` so no local paths are included.
      render: text
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps. Use synthetic examples only.
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include any fixed error code printed (for example `error store_newer`). Check screenshots for private data before sharing.
    validations:
      required: true
  - type: checkboxes
    id: no-session-content
    attributes:
      label: Content check
      options:
        - label: This report contains no prompts, model responses, real file paths or account details from coding-agent sessions.
          required: true
